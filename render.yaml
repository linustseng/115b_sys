services:
  - type: web
    name: 115b-sys-api
    env: node
    rootDir: services/api
    plan: starter
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ACADEMICS_ICS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ATTACHMENT_BUCKET
        value: attachments
      - key: SUPABASE_ACTIVITY_ALBUM_BUCKET
        value: activity-albums
      - key: SUPABASE_STORAGE_MONITORING_QUOTA_BYTES
        value: "100000000000"
      - key: SUPABASE_STORAGE_MONITORING_PLAN_LABEL
        value: Supabase Pro
      - key: ATTACHMENT_SIGNED_URL_TTL_SECONDS
        value: "1800"
      - key: ATTACHMENT_MAX_FILE_SIZE_BYTES
        value: "20971520"
